map $http_origin $cors_origin {
    # 无 Origin 的直连访问保持通配；携带 Origin 的跨站请求必须回显来源，
    # 否则主应用（qiankun 宿主）带凭据拉取入口时会被浏览器按 CORS 规则拦截。
    "" "*";
    default $http_origin;
}

server {
    listen 80;
    server_name localhost;
    absolute_redirect off;

    location = / {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Vary "Origin" always;
        return 302 /midplat-frontend/;
    }

    location = /midplat-frontend {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Vary "Origin" always;
        return 301 /midplat-frontend/;
    }

    location /midplat-frontend/ {
        alias /static/;
        index index.html;
        try_files $uri $uri/ /midplat-frontend/index.html;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Vary "Origin" always;
    }

    # 兜底：qiankun 宿主注册的 entry 若缺少部署前缀，注入的 publicPath 会指向
    # 站点根，异步 chunk 与 favicon 会按裸路径请求；这里直接命中静态产物。
    location / {
        root /static;
        try_files $uri =404;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Vary "Origin" always;
    }

    # Service callbacks only use the backend's loopback address inside the deployment.
    location ^~ /api/fusion-internal/ {
        return 404;
    }

    location /api/ {
        # API 跨域响应由 Spring Boot 统一生成，避免 nginx 与后端重复写响应头。
        proxy_pass http://${MIDPLAT_BACKEND_HOST}:${MIDPLAT_BACKEND_PORT}/api/;
        proxy_http_version 1.1;
        proxy_connect_timeout 3;
        proxy_send_timeout 150;
        proxy_read_timeout 650;
        proxy_buffering off;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-Deadline-Ms $http_x_request_deadline_ms;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
