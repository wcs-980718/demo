apiVersion: v1
kind: Service
metadata:
  name: midplat-frontend
  labels:
    app: midplat-frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      nodePort: 31010
      name: web-http
  selector:
    app: midplat-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: midplat-frontend
  labels:
    app: midplat-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: midplat-frontend
  template:
    metadata:
      labels:
        app: midplat-frontend
    spec:
      imagePullSecrets:
        - name: registry-key
      containers:
        - name: midplat-frontend
          image: reg.malacca.tech:8000/midplat-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: web-port
              containerPort: 80
      nodeSelector:
        node: dev
