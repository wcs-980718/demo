server:
  port: ${MIDPLAT_PORT:8090}
  servlet:
    session:
      cookie:
        name: MIDPLAT_SESSION

spring:
  application:
    name: midplat-backend
  datasource:
    url: ${MIDPLAT_DB_URL:jdbc:postgresql://localhost:5433/ai_midplat}
    username: ${MIDPLAT_DB_USERNAME:postgres}
    password: ${MIDPLAT_DB_PASSWORD:}
    hikari:
      auto-commit: false
      data-source-properties:
        logServerErrorDetail: false
  flyway:
    enabled: true
    schemas: public
    default-schema: public
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: public
        jdbc:
          batch_size: 15
        connection:
          provider_disables_autocommit: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.hibernate.orm.jdbc.bind: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF
    org.springframework.jdbc.core.StatementCreatorUtils: OFF

springdoc:
  swagger-ui:
    path: /swagger-ui.html

midplat:
  evaluation:
    executor:
      core-pool-size: ${MIDPLAT_EVALUATION_EXECUTOR_CORE_POOL_SIZE:1}
      max-pool-size: ${MIDPLAT_EVALUATION_EXECUTOR_MAX_POOL_SIZE:2}
      queue-capacity: ${MIDPLAT_EVALUATION_EXECUTOR_QUEUE_CAPACITY:50}
  platform-endpoints:
    indicator-settings-url: ${MIDPLAT_INDICATOR_SETTINGS_URL:}
  platform-bootstrap:
    knowledge-entry-url: ${MIDPLAT_KNOWLEDGE_ENTRY_URL:}
    annotation-entry-url: ${MIDPLAT_ANNOTATION_ENTRY_URL:}
    indicator-entry-url: ${MIDPLAT_INDICATOR_ENTRY_URL:}
  agent:
    root-cause:
      base-url: ${MIDPLAT_ROOT_CAUSE_AGENT_BASE_URL:http://localhost:8083/v1}
      api-key: ${MIDPLAT_ROOT_CAUSE_AGENT_API_KEY:}
